<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; script-src 'none'">
<meta http-equiv="refresh" content="30">
<title>board</title>
<style>
{{tokens}}
main { max-width: none; }
.board {
  display: flex;
  gap: 0.75rem;
  overflow-x: auto;
  align-items: flex-start;
  padding-bottom: 0.5rem;
}
.col {
  flex: 0 0 16rem;
  min-width: 16rem;
  max-height: calc(100vh - 4.5rem);
  overflow-y: auto;
  background: var(--bg-elev);
  border: 1px solid var(--line);
  border-radius: 0.35rem;
  padding: 0.4rem 0.55rem 0.6rem;
}
.col h2 {
  position: sticky;
  top: 0;
  margin: 0 0 0.35rem;
  padding: 0.15rem 0;
  background: var(--bg-elev);
  font-size: 0.78rem;
  letter-spacing: 0.01em;
}
.col.dropped { opacity: 0.45; }
.card {
  border-top: 1px solid var(--line);
  padding: 0.4rem 0 0.15rem;
}
.card h3 {
  font-size: 0.95rem;
  font-weight: 650;
  line-height: 1.3;
  margin: 0 0 0.15rem;
}
.card a { color: var(--text); text-decoration: none; }
.card a:hover { color: var(--green); }
.card .plan { font-size: 0.8rem; }
.worktree {
  margin: 0.2rem 0 0;
  font-size: 0.75rem;
  overflow-wrap: anywhere;
}
.jobs li.label { color: var(--text-dim); font-size: 0.85rem; }
.jobs li.cancelled,
.jobs li.cancelled .chip { color: var(--text-dim); }
</style>
</head>
<body>
<header class="top">
  <span class="brand">keel</span>
  <span class="chip">board</span>
</header>
<main>
  <div class="board">
{{columns}}
  </div>
</main>
<script type="application/json" id="keel-doc">{{doc}}</script>
</body>
</html>
